[pytest]
# Repository root is the pytest rootdir. The Python package under
# packages/core/src must be installed (`pip install -e "packages/core[dev]"`).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config
markers =
    unit: fast, isolated unit tests.
    scientific: numerical correctness / golden-reference tests.
    integration: end-to-end workflows across several modules.
filterwarnings =
    error::DeprecationWarning:drw.*
